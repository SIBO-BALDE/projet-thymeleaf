<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      layout:decorate="template1">
<!-- ✅ Bootstrap 5 CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ✅ Bootstrap 5 JS Bundle CDN (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="/webjars/bootstrap/5.3.6/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content1">
    <div class="container mt-2">
        <div class="card">
        <div class="card-header"><h3>Liste des patients</h3></div>
        <div class="card-body mt-4">
            <form method="get" th:action="@{index}" class="row g-2 align-items-center">
                <div class="col-auto">
                    <input type="text" class="form-control" id="inputSearch2" placeholder="Nom patient" name="keyword"  th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Chercher</button>
                </div>
            </form>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Date de naissance</th>
                    <th>Malade</th>
                    <th>Score</th>
                    <th sec:authorize="hasRole('ADMIN')">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p:${ListPatient}">
                    <td  th:text="${p.id}"></td>
                    <td  th:text="${p.nom}"></td>
                    <td  th:text="${p.dateNaissance}"></td>
                    <td  th:text="${p.malade}"></td>
                    <td  th:text="${p.score}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                    <!--                        <a class="btn btn-success" >Add</a>-->
                        <a class="btn btn-primary"  th:href="@{editPatient(id=${p.id}, keyword=${keyword},page=${currentPage})}" >Modifier</a>
                        <a class="btn btn-danger"  onclick="return confirm('Etes vous sure de vouloir supprimer?')" th:href="@{delete(id=${p.id}, keyword=${keyword},page=${currentPage})}" >Supprimer</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <ul class="nav nav-pills">
                <li th:each="page, status:${pages}">
                    <a th:class="${status.index == currentPage ? 'btn btn-info m-lg-1' : 'btn btn-outline-info m-lg-1'}"
                       th:text="${status.index}"
                       th:href="@{index(page=${status.index})}">
                    </a>
                </li>
            </ul>
        </div>
        </div>
        </div>
    </div>
</body>
</html>
