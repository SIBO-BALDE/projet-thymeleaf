<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<!-- ✅ Bootstrap 5 CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ✅ Bootstrap 5 JS Bundle CDN (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="/webjars/bootstrap/5.3.6/css/bootstrap.min.css">
</head>
<body>
<h1>Liste des patients</h1>
<table class="table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Date de naissance</th>
        <th>Malade</th>
        <th>Score</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p:${ListPatient}">
        <td  th:text="${p.id}"></td>
        <td  th:text="${p.nom}"></td>
        <td  th:text="${p.dateNaissance}"></td>
        <td  th:text="${p.malade}"></td>
        <td  th:text="${p.score}"></td>
    </tr>
    </tbody>
</table>
<ul class="nav nav-pills">
    <li th:each="page, status:${pages}">
        <a th:class="${status.index == currentPage ? 'btn btn-info m-lg-1' : 'btn btn-outline-info m-lg-1'}"
           th:text="${status.index}"
           th:href="@{index(page=${status.index})}"
        >

        </a>
    </li>
</ul>
</body>
</html>
