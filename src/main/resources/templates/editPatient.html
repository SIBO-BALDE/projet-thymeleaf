<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="template1">
<!-- ✅ Bootstrap 5 CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- ✅ Bootstrap 5 JS Bundle CDN (JS + Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="/webjars/bootstrap/5.3.6/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content1" class="card col-md-6 offset-md-3 mt-4 pt-4 pb-4" style=" border-top-right-radius: 25px;
    border-bottom-left-radius: 25px; border-right:10px solid #0d6efd; border-left:10px solid #0d6efd;">
    <div class="col-md-6 offset-md-3">
        <form method="post" th:action="@{save(page=${page}, keyword=${keyword})}">
            <h4>EDIT PATIENT</h4>
            <div class="mt-2">
                <label for="id">ID</label>
                <input class="form-control" type="text" name="id" th:value="${patient.id}" id="id" disabled>
            </div>
            <div class="mt-2">
                <label for="nom">Nom</label>
                <input class="form-control" type="text" name="nom" th:value="${patient.nom}" id="nom">
                <span class="text-danger" th:errors="${patient.nom}"></span>
            </div>
            <div class="mt-2">
                <label for="dateNaissance">Date Naissance</label>
                <input class="form-control" type="date" name="dateNaissance" th:value="${patient.dateNaissance}" id="dateNaissance">
                <span class="text-danger" th:errors="${patient.dateNaissance}"></span>
            </div>
            <div class="mt-2">
                <label for="malade">Malade</label>
                <input type="checkbox" name="malade" th:checked="${patient.malade}" id="malade" />
                <span th:errors="${patient.malade}"></span>
            </div>
            <div class="mt-2">
                <label for="score">Score</label>
                <input class="form-control" type="text" name="score" th:value="${patient.score}" id="score">
<!--                <input class="form-control" type="number" name="score" th:value="${patient.score}" id="score">-->
                <span class="text-danger" th:errors="${patient.score}"></span>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Modifier</button>
        </form>
        </div>

    </div>
</body>
</html>
